name: CI Build & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        build_type: [ Release ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pandas

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build Project
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Catch2 Unit Tests (CTest)
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure

      - name: Run Synthetic Trace Generation & Simulator Test
        run: |
          python scripts/generate_traces.py --pattern sequential --warps 4 --instructions 100 --output traces/ci_test.trace
          python scripts/run_experiments.py
